name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `cf` loads cloudflare.config.ts with Node, not Bun, and needs 22.18+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: node --test
      - name: Worker dry run
        run: bun run deploy -- --dry-run

name: Push log

# GitHub Projects has no commit item type, so this workflow keeps a single
# "XB · push log" issue up to date. That issue is a card on the All work board
# (project 1). Each push prepends its commits to the issue body and sets the
# issue title to the newest commit, so the board shows the latest activity.
#
# The issue number lives in the PUSH_LOG_ISSUE repository variable, not in the
# workflow, so the log can be moved without a code change.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: project-push-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          PUSH_LOG_ISSUE: ${{ vars.PUSH_LOG_ISSUE }}
        with:
          script: |
            const issueNumber = Number(process.env.PUSH_LOG_ISSUE || '');
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Set the PUSH_LOG_ISSUE repository variable to the push log issue number.');
              return;
            }

            const { owner, repo } = context.repo;
            const branch = String(context.ref || '').replace(/^refs\/heads\//, '');
            const head = context.payload.head_commit;
            const commits = Array.isArray(context.payload.commits) ? context.payload.commits : [];
            const ordered = commits.length ? commits : head ? [head] : [];
            if (!ordered.length) return;

            const markerStart = '<!-- push-log:start -->';
            const markerEnd = '<!-- push-log:end -->';
            const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const subject = value => String(value || '').split('\n')[0].trim().slice(0, 140);

            const current = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
            const body = current.data.body || '';
            const startAt = body.indexOf(markerStart);
            const endAt = body.indexOf(markerEnd);
            const existing = startAt >= 0 && endAt > startAt
              ? body.slice(startAt + markerStart.length, endAt).trim()
              : '';
            const existingLines = existing ? existing.split('\n').filter(Boolean) : [];
            const known = new Set(
              [...existing.matchAll(/`([0-9a-f]{7,40})`/gi)].map(match => match[1].slice(0, 7)),
            );

            const fresh = ordered
              .slice()
              .reverse()
              .map(commit => {
                const sha = String(commit.id || '').slice(0, 7);
                return {
                  sha,
                  line: `- [\`${sha}\`](${commit.url}) — ${stamp} — ${subject(commit.message)}`,
                };
              })
              .filter(item => item.sha && !known.has(item.sha));

            if (!fresh.length) return;

            const all = [...fresh.map(item => item.line), ...existingLines].slice(0, 80);
            const latest = subject(head?.message || ordered[ordered.length - 1]?.message || 'push');
            const nextBody = [
              'Rolling log of pushes to this repository. The **All work** project keeps this issue as the X Bookmark Vault activity card.',
              '',
              `Repository: https://github.com/${owner}/${repo}`,
              `Latest push: ${stamp} on \`${branch}\``,
              '',
              markerStart,
              ...all,
              markerEnd,
              '',
              '_Updated automatically by `.github/workflows/project-push-log.yml`._',
            ].join('\n');

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              title: `XB · ${latest}`,
              body: nextBody,
            });

            core.info(`Logged ${fresh.length} new commit(s) to #${issueNumber}.`);

name: Shelf
options:
  bundleIdPrefix: tr.nuritas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Shelf:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shelf
        excludes:
          - Info.plist
          - Shelf.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.nuritas.shelf
        PRODUCT_NAME: Shelf
        INFOPLIST_FILE: Shelf/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shelf/Shelf.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ShelfShareExtension
        embed: true
  ShelfShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - ShelfShareExtension.entitlements
      - path: Shelf/ServerConfig.swift
      - path: Shelf/Keychain.swift
      - path: Shelf/APIClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.nuritas.shelf.share
        PRODUCT_NAME: ShelfShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShelfShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Shelf:
    build:
      targets:
        Shelf: all
        ShelfShareExtension: [run, archive]
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
